name: Daily Smoke Test
on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx
      - run: python scripts/smoke_test.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR_ID: ${{ secrets.ACTOR_ID }}
  keepalive:
    # GitHub turns off schedules in public repos after 60 days without a commit.
    # Re-enabling the workflow through the API restarts that clock. Separate job
    # so it still runs when the smoke test fails.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-smoke.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
